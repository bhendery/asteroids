<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="gameTitle">ARCADE</h1>
  <div class="ui">
    <span class="score">SCORE: <span id="score">0</span></span>
  </div>
  <div class="canvas-wrap">
    <div id="lives" class="lives-hud" aria-label="Lives remaining"></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>
  <p class="instructions" id="instructions">CHOOSE A GAME TO BEGIN</p>

  <div id="startScreen" class="start-screen">
    <h2>SELECT GAME</h2>
    <p>Pick your adventure.</p>
    <div class="game-choice">
      <button id="startAsteroids">ASTEROID SHOOTER</button>
      <button id="startFrogger">SPACE FROGGER</button>
    </div>
  </div>

  <div id="gameOverScreen" class="game-over hidden">
    <h2>GAME OVER</h2>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button id="restartBtn">PLAY AGAIN</button>
    <button id="menuBtn">MAIN MENU</button>
  </div>

  <script src="game.js"></script>
  <script src="frogger.js"></script>
</body>
</html>
